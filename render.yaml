services:
  - type: web
    name: job-hunt-os
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: BRAVE_SEARCH_API_KEY
        sync: false

  - type: cron
    name: job-hunt-followups
    runtime: docker
    plan: starter
    schedule: "30 3 * * *"
    dockerCommand: python -m app.cron
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
