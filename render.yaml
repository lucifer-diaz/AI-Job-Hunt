services:
  - type: web
    name: job-hunt-os
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      # Encrypts saved API keys; set the same value on the cron service.
      - key: SECRET_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      # Headless Chromium for job-description recovery. On a small instance keep one page at a time and close the
      # browser between batches (about 200-400 MB while it runs); PLAYWRIGHT_ENABLED=false keeps recovery HTTP-only.
      - key: PLAYWRIGHT_MAX_CONCURRENCY
        value: "1"
      - key: PLAYWRIGHT_KEEP_BROWSER_RUNNING
        value: "false"

  - type: cron
    name: job-hunt-followups
    runtime: docker
    plan: starter
    schedule: "30 3 * * *"
    dockerCommand: python -m app.cron
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
