<style>
.providers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.provider{border:1px solid #ddd;border-radius:10px;padding:14px}.provider input{width:auto}.provider:has(input:checked){border-color:#2563eb;background:#eff6ff}.ready{color:#166534}.missing{color:#b91c1c}#message{padding-top:12px;font-weight:600}@media(max-width:650px){.providers{grid-template-columns:1fr}}
</style>
<section class="card"><h2>LLM provider</h2><p class="muted">Credentials remain server-side environment secrets and can never be edited here.</p>
<div class="providers" id="providers">
<label class="provider"><input type="radio" name="provider" value="openrouter" checked> OpenRouter <div class="muted" id="credential-openrouter">Checking…</div></label>
<label class="provider"><input type="radio" name="provider" value="openai"> OpenAI <div class="muted" id="credential-openai">Checking…</div></label>
<label class="provider"><input type="radio" name="provider" value="anthropic"> Anthropic <div class="muted" id="credential-anthropic">Checking…</div></label>
</div>
<label>OpenRouter model<input id="openrouter_model" type="text" value="openrouter/free"></label>
<label>OpenAI model<input id="openai_model" type="text"></label>
<label>Anthropic model<input id="anthropic_model" type="text"></label></section>
<section class="card"><h2>Workflow</h2>
<label>Approval mode<select id="approval_mode"><option value="manual">Manual approval</option><option value="review_required">Reviewer approval required</option></select></label>
<label>Minimum fit score<input id="min_fit_score" type="number" min="0" max="100"></label>
<label>Follow-up delay (days)<input id="followup_days" type="number" min="1" max="90"></label>
<label>Maximum jobs per batch<input id="max_jobs_per_batch" type="number" min="1" max="200"></label></section>
<button onclick="save()">Save settings</button><button class="secondary" onclick="testConnection()">Test connection</button><div id="message" role="status"></div>
<script>
let current;
const message=document.getElementById('message');
async function settingsRequest(url,options){const response=await fetch(url,options);const body=await response.json().catch(()=>({detail:'The server returned an unreadable response'}));if(!response.ok)throw new Error(body.detail||`Request failed (${response.status})`);return body}
function render(data){current=data;document.querySelector(`[name=provider][value="${data.active_provider}"]`).checked=true;for(const key of ['openrouter_model','openai_model','anthropic_model','approval_mode','min_fit_score','followup_days','max_jobs_per_batch'])document.getElementById(key).value=data[key];for(const provider of ['openrouter','openai','anthropic']){const state=data.credentials[provider],el=document.getElementById(`credential-${provider}`);el.textContent=state.configured?`Credential ready ${state.masked_suffix||''}`:'Credential not configured';el.className=state.configured?'muted ready':'muted missing'}}
function payload(){return {active_provider:document.querySelector('[name=provider]:checked').value,openrouter_model:value('openrouter_model'),openai_model:value('openai_model'),anthropic_model:value('anthropic_model'),approval_mode:value('approval_mode'),min_fit_score:Number(value('min_fit_score')),followup_days:Number(value('followup_days')),max_jobs_per_batch:Number(value('max_jobs_per_batch'))}}
function value(id){return document.getElementById(id).value.trim()}
async function save(){message.textContent='Saving…';try{render(await settingsRequest('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())}));message.textContent='Settings saved.'}catch(error){message.textContent=`Could not save settings: ${error.message}`}}
async function testConnection(){message.textContent='Testing connection…';try{await save();const result=await settingsRequest('/api/settings/test',{method:'POST'});message.textContent=result.message}catch(error){message.textContent=`Connection failed: ${error.message}`}}
settingsRequest('/api/settings').then(render).catch(error=>message.textContent=`Could not load settings: ${error.message}`);
</script>
