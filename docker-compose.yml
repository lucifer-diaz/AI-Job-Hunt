services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD: jobhunt
      POSTGRES_DB: jobhunt
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://jobhunt:jobhunt@db:5432/jobhunt
    depends_on: [db]
volumes:
  pgdata:
