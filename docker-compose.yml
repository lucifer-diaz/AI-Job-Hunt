services:
  db:
    # PostgreSQL 17 with the pgvector extension (optional vector retrieval, README section 9d).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD: jobhunt
      POSTGRES_DB: jobhunt
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    # Headless Chromium (job-description recovery) uses shared memory; the app also passes --disable-dev-shm-usage.
    shm_size: "512m"
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://jobhunt:jobhunt@db:5432/jobhunt
    depends_on: [db]
volumes:
  pgdata:
