[project]
name = "job-hunt-os"
version = "0.1.0"
description = "Human-in-the-loop AI job hunting workflow"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.0,<7",
  "pypdfium2>=4.30,<6",
  "python-docx>=1.1,<2",
  "openai>=2.0,<3",
  "anthropic>=0.67,<1",
  "reportlab>=4.4,<5",
  "email-validator>=2.2,<3",
  "google-adk>=2.10,<3",
  "alembic>=1.13,<2",
  "cryptography>=42,<51",
  "tzdata>=2024.1",
  "mcp>=2.3,<3",
  "pyyaml>=6.0,<7",
  "playwright>=1.49,<2",
  "langgraph==1.2.12",
  "langgraph-checkpoint==4.2.0",
  "langgraph-checkpoint-postgres==3.1.2",
  "langchain-core==1.6.5",
  "langsmith==0.14.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "pytest-cov>=7,<8",
       "fonttools>=4.50,<5"]  # fonttools: scripts/build_resume_fixtures.py only

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "strict_resume_policy: run with the production CandidatePolicy (verified resume facts only)",
    "strict_ranking: tailoring requires a real completed FitAnalysis (no test stand-in)",
    "strict_approval: approval requires a job whose workflow state can reach READY_TO_APPLY (no test stand-in)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Header"]
