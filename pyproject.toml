[project]
name = "job-hunt-os"
version = "0.1.0"
description = "Human-in-the-loop AI job hunting workflow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.0,<7",
  "python-docx>=1.1,<2",
  "openai>=2.0,<3",
  "anthropic>=0.67,<1",
  "reportlab>=4.4,<5",
  "email-validator>=2.2,<3",
  "google-adk>=1.15,<2",
  "alembic>=1.13,<2",
  "cryptography>=42,<51",
  "tzdata>=2024.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
